name: Deploy a producción (GitHub Pages)

# Cada push a main publica el sitio automáticamente.
# También se puede lanzar a mano desde la pestaña Actions.
# Lo que se publica es la carpeta sitio/; ver README.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar el sitio (copia sitio/, crea las redirecciones y revisa los enlaces)
        run: python3 scripts/armar-sitio.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
