/* =========================================================
   TUNER — the radio
   ========================================================= */
const HZ_MIN=1,HZ_MAX=24;
const posOf=hz=>Math.log(hz/HZ_MIN)/Math.log(HZ_MAX/HZ_MIN);
const tuner={p:posOf(7),stat:0,station:'create'};
const blocked=()=>!!(state.playing&&Engine.ctx&&Engine.ctx.state!=='running');
const hzOf=p=>HZ_MIN*Math.pow(HZ_MAX/HZ_MIN,p);
const LOCK=.02, FADE=.075;
function nearest(p){let best=null,dist=9;ORDER.forEach(k=>{const d=Math.abs(posOf(WORLDS[k].hz)-p);if(d<dist){dist=d;best=k;}});return {k:best,dist};}
function mountTuner(){
  if(!$('#orb')) return;
  $('#orb').onclick=powerToggle; $('#power').onclick=powerToggle;
  $('#ticks').innerHTML=TICKS(); $('#slabels').innerHTML=SLABELS();
  bindDial($('#dial'));
  $('#scan').onclick=scan;
  setP(tuner.p,false);
}
const TICKS=()=>{let h='';for(let i=0;i<=120;i++)h+=`<i class="${i%10?'':'l'}" style="left:${i/120*100}%"></i>`;return h;};
const SLABELS=()=>ORDER.map(k=>`<button class="slabel ${k==='awaken'||k==='dream'?'alt':''}" data-tune="${k}" style="left:${posOf(WORLDS[k].hz)*100}%">${WORLDS[k].name}</button>`).join('');
function bindDial(dial){
  dial.querySelectorAll('[data-tune]').forEach(b=>b.onclick=()=>tuneTo(b.dataset.tune));
  const from=e=>{const r=dial.getBoundingClientRect();return (e.clientX-r.left)/r.width;};
  dial.addEventListener('pointerdown',e=>{if(e.target.closest('.slabel'))return;dial.setPointerCapture(e.pointerId);tuner.dragging=true;stopScan();setP(from(e),true);});
  dial.addEventListener('pointermove',e=>{if(tuner.dragging)setP(from(e),true);});
  const up=()=>{if(!tuner.dragging)return;tuner.dragging=false;const n=nearest(tuner.p);if(n.dist<LOCK*2.2)glide(posOf(WORLDS[n.k].hz));};
  dial.addEventListener('pointerup',up); dial.addEventListener('pointercancel',up);
  dial.addEventListener('keydown',e=>{
    const step={ArrowLeft:-.006,ArrowRight:.006,ArrowDown:-.006,ArrowUp:.006}[e.key];
    if(step){e.preventDefault();stopScan();setP(tuner.p+step,true);}
    if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();jumpStation(e.key==='PageUp'?1:-1);}
  });
}
function powerToggle(){
  if(tuner.unlocked) return;                       // that tap only woke the audio up
  if(blocked()){Engine.resume();return;}
  if(state.playing){togglePlay();return;}
  const c=state.current;
  if(c&&(c.type==='Live Station'||c.mine)&&c.world===tuner.station){togglePlay();return;}
  setP(posOf(WORLDS[tuner.station].hz),true);
}
function tuneTo(k){stopScan();glide(posOf(WORLDS[k].hz));}
/* the dial: drag between stations and you only hear a soft hum */
function setP(p,user){
  tuner.p=Math.min(1,Math.max(0,p));
  const n=nearest(tuner.p), tuned=n.dist<LOCK;
  tuner.station=n.k; tuner.between=!tuned;
  const hzS=hzOf(tuner.p).toFixed(1).padStart(4,'0');
  document.querySelectorAll('.needle').forEach(x=>x.style.left=tuner.p*100+'%');
  document.querySelectorAll('.dial').forEach(d=>d.setAttribute('aria-valuenow',hzOf(tuner.p).toFixed(1)));
  if($('#tHz')){$('#tHz').innerHTML=hzS+'<small>Hz</small>';$('#tBand').textContent=WORLDS[n.k].band;}
  if($('#stHz')){$('#stHz').textContent=hzS;$('#stBand').textContent=WORLDS[n.k].band;}
  document.querySelectorAll('.slabel').forEach(b=>b.classList.toggle('on',b.dataset.tune===n.k&&tuned));
  if(user){
    const c=state.current, here=c&&(c.type==='Live Station'||c.mine)&&c.world===n.k;
    if(tuned){
      if(!here||!state.playing) playTrack(TRACKS['station-'+n.k],{fromTuner:true});
      tuner.stat=0; Engine.setStatic(0); Engine.setLevel(1);
    }else{
      if(!state.playing) playTrack(TRACKS['station-'+n.k],{fromTuner:true});
      const f=Math.min(1,(n.dist-LOCK)/FADE);
      tuner.stat=f; Engine.setStatic(.07+f*.1); Engine.setLevel(Math.max(0,1-f*1.2));
    }
  }
  paintPower();
}
function glide(to,ms=650,done){
  const from=tuner.p,t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);setP(from+(to-from)*e,true);if(k<1)tuner.raf=requestAnimationFrame(step);else done&&done();};
  cancelAnimationFrame(tuner.raf); tuner.raf=requestAnimationFrame(step);
}
function jumpStation(dir){
  const sorted=[...ORDER].sort((a,b)=>WORLDS[a].hz-WORLDS[b].hz);
  let i=sorted.indexOf(nearest(tuner.p).k)+dir; i=(i+sorted.length)%sorted.length;
  glide(posOf(WORLDS[sorted[i]].hz));
}
function scan(){
  if(tuner.scanning){stopScan();return;}
  tuner.scanning=true; $('#scan .mono').textContent=L('Stop','Parar');
  const next=()=>{if(!tuner.scanning)return;const sorted=[...ORDER].sort((a,b)=>WORLDS[a].hz-WORLDS[b].hz);const i=(sorted.indexOf(nearest(tuner.p).k)+1)%sorted.length;
    glide(posOf(WORLDS[sorted[i]].hz),1600,()=>{tuner.scanTO=setTimeout(next,6000);});};
  next();
}
function stopScan(){tuner.scanning=false;clearTimeout(tuner.scanTO);const s=$('#scan .mono');if(s)s.textContent=L('Scan','Buscar');}

  const on=state.playing; b.classList.toggle('on',on); b.firstElementChild.innerHTML=on?ICON.pause:ICON.play; b.lastElementChild.textContent=on?'ON AIR':'OFF AIR';
  const k=tuner.station,w=WORLDS[k],c=state.current,live=on&&c&&(c.type==='Live Station'||c.mine)&&c.world===k&&!tuner.between,bl=blocked();
  $('#tSt').textContent=`${w.name} FM · ${w.hz} Hz`; $('#tLine').textContent=tx(w,'line');
  $('#tStatus').textContent=bl?L('Tap anywhere to hear it','Toca en cualquier parte para escucharlo'):on&&tuner.between?L('Between stations ···','Entre estaciones ···'):live?(c.mine?L('● Live · your Oazis','● En vivo · tu Oazis'):L('● Live now','● En vivo')):on?L('Playing · ','Sonando · ')+c.title:L('Press play or turn the dial','Dale play o gira el dial');

/* =========================================================
   PLAYBACK
   ========================================================= */
function playTrack(t,opts={}){
  if(!t) return;
  state.current=t; state.elapsed=0; state.playing=true; state.phase=-1;
  applyState(t.world); Engine.play(recipe(t));
  if(locked(t)) toast(L('Preview · 30 seconds of Oazis Plus','Preview · 30 segundos de Oazis Plus'));
  if(!opts.fromTuner){Engine.setStatic(0);tuner.stat=0;}
  if(!opts.fromTuner){if(document.querySelector('.needle'))setP(posOf(WORLDS[t.world].hz),false);else{tuner.station=t.world;tuner.p=posOf(WORLDS[t.world].hz);}}
  if(t.type!=='Live Station'){state.recent=[t.id,...state.recent.filter(x=>x!==t.id)].slice(0,10);save();}
  checkPhase(); updatePlayer(); markRows();
  if(t.phases&&!opts.fromTuner) openNP();
  else if(state.npOpen) renderNP();
}
function togglePlay(){
  if(tuner.unlocked) return;
  if(!state.current){playTrack(TRACKS['station-'+tuner.station]);return;}
  if(state.playing){state.playing=false;Engine.pause();}
  else{state.playing=true;if(!Engine.voice)Engine.play(recipe(state.current));else Engine.resume();}
  updatePlayer(); if(state.npOpen) renderNP();
}
function finish(){
  const t=state.current; Engine.stop(); state.playing=false;
  if(t.type==='Program'){state.done.add(t.id);save();}
  updatePlayer(); if(state.npOpen) renderNP();
  toast('Session complete');
  if(t.phases||['create','dream','awaken'].includes(t.world)||(profile&&persona(profile).journal)) setTimeout(()=>openCapture(),700);
  if(route().name==='program') render();
}
function checkPhase(){
  const t=state.current; if(!t||!t.phases) return;
  let acc=0,idx=t.phases.length-1;
  for(let i=0;i<t.phases.length;i++){acc+=t.phases[i][1]*60;if(state.elapsed<acc){idx=i;break;}}
  if(idx!==state.phase){
    state.phase=idx;
    if(state.voice&&state.playing&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.phases[idx][2]);u.lang=LANG==='es'?'es-ES':'en-US';u.rate=.86;u.pitch=.95;speechSynthesis.speak(u);}
    if(state.npOpen) renderNP();
  }
}
setInterval(()=>{
  if(!state.playing||!state.current||blocked()) return;
  state.elapsed++; checkPhase();
  const L=limit(state.current); if(L&&state.elapsed>=L){locked(state.current)?previewEnd():finish();return;}
  paintTime();
},1000);

function paintTime(){
  const t=state.current, L=t?limit(t):0;
  $('#tEl').textContent=fmt(state.elapsed);
  $('#tTot').textContent=L?fmt(L):'∞';
  const bar=$('#pBar'); bar.classList.toggle('inf',!L&&state.playing); bar.firstElementChild.style.width=L?(state.elapsed/L*100)+'%':'0%';
  $('#player').style.setProperty('--pp',L?(state.elapsed/L*100)+'%':'0%');
  const big=$('#npTime'); if(big) big.textContent=L?fmt(L-state.elapsed):fmt(state.elapsed);
  const sT=$('#stTime'); if(sT) sT.textContent=L?fmt(L-state.elapsed):fmt(state.elapsed);
  if(t&&t.phases){let acc=0;t.phases.forEach((p,i)=>{const u=document.querySelector(`#ph${i} u`);if(u)u.style.width=Math.min(100,Math.max(0,(state.elapsed-acc)/(p[1]*60)*100))+'%';acc+=p[1]*60;});}
}
function updatePlayer(){
  const t=state.current;
  $('#npMini').innerHTML=t?`${art(t.world,t.seed)}<div style="min-width:0"><b>${esc(t.title)}</b><span>${WORLDS[t.world].name} · ${locked(t)?L('Preview · 30 s','Preview · 30 s'):t.type}</span></div>`
    :`<div class="ph">${ICON.wave}</div><div><b>${L('Nothing tuned yet','Nada sintonizado aún')}</b><span>${L('Press play or turn the dial','Dale play o gira el dial')}</span></div>`;
  $('#bPlay').innerHTML=state.playing?ICON.pause:ICON.play; $('#bPlay').setAttribute('aria-label',state.playing?'Pause':'Play');
  const fav=t&&state.favs.has(t.id); $('#bFav').classList.toggle('heart',true); $('#bFav').classList.toggle('on',!!fav);
  $('#bTimer').textContent=(t&&t.phases)?'GUIDED':(state.timer?state.timer+' MIN':'∞ TIMER');
  $('#bState').textContent=stateLabel().toUpperCase();

}

function dayOrder(){const h=new Date().getHours(),hh=h<5?h+24:h,i=Math.max(0,DAYPARTS.findIndex(p=>hh>=p.from&&hh<p.to));return [...DAYPARTS.slice(i),...DAYPARTS.slice(0,i)];}
const partOf=t=>(DAYPARTS.find(p=>p.f(t))||DAYPARTS[1]).id;

  if(!b) return;

function openSale(name,arg){

  if(name==='checkout'){el.innerHTML=coHTML(arg==='year'?'year':'loyalty');bindCO(arg==='year'?'year':'loyalty');}
  else el.innerHTML=saleHTML();
  el.scrollTop=0;
}
function closeSale(){sale.open=false;$('#sale').classList.remove('open');$('#sale').innerHTML='';}
$('#sale').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='saleX'){location.hash='#/home';return;}
  if(b.dataset.pl){sale.plan=b.dataset.pl;const y=$('#sale').scrollTop;$('#sale').innerHTML=saleHTML();$('#sale').scrollTop=y;return;}
  if(b.dataset.co){location.hash='#/checkout/'+sale.plan;return;}
});
function drawSale(now){
  const T=now/1000;
  document.querySelectorAll('#sale canvas[data-w]').forEach(cv=>{
    const r=cv.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return;
    const W=Math.round(cv.clientWidth*1.5),H=Math.round(cv.clientHeight*1.5); if(!W) return; if(cv.width!==W){cv.width=W;cv.height=H;}
    const g=cv.getContext('2d'); g.clearRect(0,0,W,H); g.lineCap='round';
    if(cv.dataset.w==='off'){
      for(let j=0;j<7;j++){g.beginPath();for(let x=0;x<=W;x+=4){const u=x/W,y=H/2+Math.sin(u*(9+j*3.1)+T*(1.3+j*.4)+j)*H*(.18+.04*(j%3))+Math.sin(u*31+T*3+j*2)*H*.05;x?g.lineTo(x,y):g.moveTo(x,y);}
        g.strokeStyle=`rgba(255,255,255,${.16+.1*(j%3)})`;g.lineWidth=1.5+(j%2)*1.5;g.stroke();}
    }else{
      for(let j=2;j>=0;j--){g.beginPath();for(let x=0;x<=W;x+=3){const u=x/W,y=H/2+Math.sin(u*Math.PI*6-T*1.4)*H*.22;x?g.lineTo(x,y):g.moveTo(x,y);}
        g.strokeStyle=j?`rgba(255,255,255,${.12/j})`:'#fff';g.lineWidth=j?14*j:3.5;g.shadowColor='rgba(255,255,255,.7)';g.shadowBlur=j?0:16;g.stroke();g.shadowBlur=0;}
    }
  });
}

function route(){const h=(location.hash||'#/home').slice(2).split('/');return {name:h[0]||'home',arg:h[1]};}
function render(){
  const r=route(), v=views[r.name]?r.name:'home';
  if(r.name==='plus'||r.name==='checkout') openSale(r.name,r.arg); else if(sale.open) closeSale();
  if(r.name!=='fm'&&st.open) closeStation(true);
  $('#main').innerHTML=views[v](r.arg);
  document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===v||(v==='world'&&a.dataset.r==='explore')));
  if(v==='home') mountTuner();
  if(r.name==='fm') openStation();
  document.querySelectorAll('[data-r="fm"]').forEach(a=>a.classList.toggle('on',r.name==='fm'));
  if(r.name==='fm') document.querySelectorAll('[data-r="home"]').forEach(a=>a.classList.remove('on'));
  if(v==='journal'){$('#jSave').onclick=()=>{if(addIdea($('#jText').value))render();};}
  markRows();
}

/* =========================================================
   WAVES — the signal, drawn from the live audio
   ========================================================= */
let waveRGB=null, smooth=0;
function drawWave(cv,t,lvl){
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(!W) return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const amp=(state.playing?.38+Math.min(.62,lvl*5):.16)*(1-tuner.stat*.6), noise=tuner.stat*(state.playing||tuner.power?1:0);
  const k=state.current?WORLDS[state.current.world].hz:WORLDS[tuner.station].hz, speed=.35+k*.03;
  for(let L=0;L<4;L++){
    g.beginPath();
    for(let x=0;x<=W;x+=3){
      const u=x/W, env=Math.exp(-Math.pow((u-.3)/.12,2))*.7+Math.exp(-Math.pow((u-.52)/.1,2))+Math.exp(-Math.pow((u-.74)/.11,2))*.75+.06;
      let y=Math.sin(u*Math.PI*2*(2+k*.06)+t*speed+L*.55)*(.65+.35*Math.sin(u*9+t*.4+L));
      y=H/2+y*env*amp*H*.42+(noise?Math.sin(u*70+t*5+L)*noise*H*.035*env:0);
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.strokeStyle=`rgba(${waveRGB},${.22+L*.18})`; g.lineWidth=1.6; g.stroke();
  }
}
const AURA={create:[[238,226,208],[196,204,226],[252,238,226]],flow:[[146,168,214],[204,204,220],[112,136,196]],dream:[[192,176,230],[224,202,238],[158,170,222]],
  calm:[[170,212,210],[212,232,226],[156,196,210]],sleep:[[104,138,204],[76,98,176],[150,172,226]],awaken:[[248,214,186],[242,234,206],[214,198,234]]};
function drawAura(cv,t,lvl){
  const W=Math.max(2,Math.round(cv.clientWidth/6)),H=Math.max(2,Math.round(cv.clientHeight/6));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const g=cv.getContext('2d'); g.clearRect(0,0,W,H);
  const k=state.current?state.current.world:tuner.station, cols=AURA[k]||AURA.create, hz=WORLDS[k].hz;
  const on=state.playing||tuner.power, e=on?.55+Math.min(.45,lvl*6):.38, st=tuner.stat;
  const dark=document.documentElement.dataset.theme==='dark';
  g.globalCompositeOperation=dark?'lighter':'source-over';
  for(let i=0;i<5;i++){
    const sp=.07+.025*i+hz*.004;
    const x=W*(.5+.4*Math.sin(t*sp+i*1.7)), y=H*(.55+.32*Math.cos(t*sp*.8+i*1.1));
    const r=Math.max(W,H)*(.26+.1*Math.sin(t*.45+i)+e*.2);
    let [cr,cg,cb]=cols[i%3]; const grey=(cr+cg+cb)/3; cr+=(grey-cr)*st; cg+=(grey-cg)*st; cb+=(grey-cb)*st;
    const a=(dark?.34:.62)*e*(1-st*.4);
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${cr|0},${cg|0},${cb|0},${a})`); gr.addColorStop(1,`rgba(${cr|0},${cg|0},${cb|0},0)`);
    g.fillStyle=gr; g.fillRect(0,0,W,H);
  }
}
/* the radio's look follows how each person sees sound (funnel Q9) */
let vizT=0, vizLast=0;
const vizStyle=()=>P('vision')[0]||'ripple';
function drawViz(cv,t,lvl){
  if(!cv.clientWidth) return;
  const style=vizStyle(), dark=document.documentElement.dataset.theme==='dark', sc=style==='lines'?1.5:3;
  const W=Math.max(2,Math.round(cv.clientWidth/sc)),H=Math.max(2,Math.round(cv.clientHeight/sc));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const key=style+dark; if(cv._k!==key){cv._k=key;const b={ripple:dark?3.2:1.1,aura:12,colors:11,blur:5,lines:0,feel:9}[style];cv.style.filter=b?`blur(${b}px)`:'none';}
  const g=cv.getContext('2d'); g.globalCompositeOperation='source-over';
  const k=state.current?state.current.world:tuner.station, hz=WORLDS[k].hz, on=state.playing&&!blocked();
  const e=(on?.68+Math.min(.32,lvl*6):.42)*(1-tuner.stat*.35), T=vizT, cx=W/2, cy=H/2, R=Math.max(W,H)/2;
  const bg=dark?'#030304':'#EDEDEE';
  if(style==='ripple'&&!dark){
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    const N=6, sp=.045+hz*.004;
    for(let i=0;i<N;i++){const ph=(T*sp+i/N)%1, r=ph*R*1.2, a=Math.sin(ph*Math.PI)*e, lw=R*.08;
      g.lineWidth=lw; g.beginPath(); g.arc(cx+lw*.22,cy+lw*.3,r,0,7); g.strokeStyle=`rgba(0,0,0,${.11*a})`; g.stroke();
      g.beginPath(); g.arc(cx-lw*.18,cy-lw*.24,Math.max(0,r-lw*.3),0,7); g.strokeStyle=`rgba(255,255,255,${a})`; g.stroke();}
    const gr=g.createRadialGradient(cx,cy,0,cx,cy,R*.2); gr.addColorStop(0,`rgba(0,0,0,${.07*e})`); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  }else if(style==='ripple'){            // dark mode: a slow blurred spiral
    g.fillStyle='#000'; g.fillRect(0,0,W,H); g.lineCap='round';
    const n=8, sp=.22+hz*.018;
    for(let j=0;j<n;j++){const r=R*(.14+j*.1), a0=T*sp*(1-j*.05)+j*.9, len=Math.PI*(1.05+.35*Math.sin(T*.35+j));
      g.lineWidth=R*.055; g.beginPath(); g.arc(cx,cy,r,a0,a0+len);
      g.strokeStyle=`rgba(232,232,232,${(.3+.45*(.5+.5*Math.sin(T*.55+j*1.3)))*e*(1-j/(n+3))})`; g.stroke();}
    g.beginPath(); g.arc(cx,cy,R*.05,0,7); g.fillStyle='#000'; g.fill();
  }else if(style==='aura'||style==='colors'){
    g.fillStyle=bg; g.fillRect(0,0,W,H); g.globalCompositeOperation=dark?'lighter':'source-over';
    const cols=style==='colors'?[[255,128,96],[104,138,255],[76,212,170],[244,146,236],[255,206,92]]:(AURA[k]||AURA.create);
    for(let i=0;i<5;i++){const sp=.07+.025*i+hz*.004, x=W*(.5+.38*Math.sin(T*sp+i*1.7)), y=H*(.5+.34*Math.cos(T*sp*.8+i*1.1)), r=R*(.55+.18*Math.sin(T*.45+i)+e*.35);
      const [cr,cg,cb]=cols[i%cols.length], a=(style==='colors'?(dark?.5:.78):(dark?.36:.66))*e;
      const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${cr},${cg},${cb},${a})`); gr.addColorStop(1,`rgba(${cr},${cg},${cb},0)`); g.fillStyle=gr; g.fillRect(0,0,W,H);}
  }else if(style==='blur'||style==='lines'){
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    const ink=dark?'236,236,232':'29,29,31', amp=(on?.42+Math.min(.5,lvl*5):.2), sp=.4+hz*.03, nL=style==='blur'?5:7;
    for(let l=0;l<nL;l++){g.beginPath();
      for(let x=0;x<=W;x+=2){const u=x/W, env=Math.sin(u*Math.PI); let y=Math.sin(u*Math.PI*2*(1.4+hz*.05)+T*sp+l*.5)*(.6+.4*Math.sin(u*7+T*.3+l));
        y=cy+y*env*amp*H*.38+(l-nL/2)*H*.014; x?g.lineTo(x,y):g.moveTo(x,y);}
      g.strokeStyle=`rgba(${ink},${(style==='blur'?.22:.16)+l*.08})`; g.lineWidth=style==='blur'?R*.07:1.1; g.stroke();}
  }else{                                  // "I just feel it": darkness and one breathing light
    g.fillStyle='#050505'; g.fillRect(0,0,W,H);
    const r=R*(.3+.08*Math.sin(T*.5)+e*.18), gr=g.createRadialGradient(cx,cy,0,cx,cy,r); gr.addColorStop(0,`rgba(255,255,255,${.55*e})`); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  }
}
function frame(now){
  if(!waveRGB) waveRGB=getComputedStyle(document.documentElement).getPropertyValue('--wave').trim();
  smooth+=(Engine.level()-smooth)*.12; const t=now/1000;
  const dt=Math.min(.1,(now-(vizLast||now))/1000); vizLast=now; vizT+=dt*(state.playing&&!blocked()?1:.3);
  const a=$('#heroWave'); if(a) drawViz(a,t,smooth);
  const b=$('#npWave'); if(b&&state.npOpen) drawViz(b,t,smooth);
  const sv=$('#stViz'); if(sv&&st.open) drawViz(sv,t,smooth);
  if(sale.open) drawSale(now);
  requestAnimationFrame(frame);
}

async function hashCode(u,code){
  const s=`oazis:${u}:${code}`;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;for(const ch of s)h=((h*33)^ch.charCodeAt(0))>>>0;return 'd'+h.toString(16);}
}

function obOK(id){
  if(id==='name') return !!(ob.ans.name||'').trim();
  if(id==='vision') return (ob.ans.vision||[]).length>0||!!(ob.ans.soundWord||'').trim();
  if(id==='key'){const u=ob.ans.user||'';if(!/^[a-z0-9._]{3,20}$/.test(u)||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ob.ans.email||''))return false;return !!ob.code||(ob.codeLen===0&&!!profile&&!!profile.codeHash&&profile.user===u);}
  const q=QG(id); return !q||(ob.ans[id]||[]).length>0;
}
function renderOB(){
  ob.mode='funnel';
  const steps=obSteps(), id=steps[ob.step], q=QG(id), qi=q?QUESTIONS.indexOf(q):-1;
  let body='', foot='';
  if(id==='welcome'){
    body=`<div class="ob-hero">${RIPPLE}<span class="ob-k">Oazis FM</span>
      <h1>${L('Create your','Crea tu')} <em>Oazis.</em></h1><p class="lead">${L('A creative space tuned only to you. A few quick questions — about a minute.','Un espacio creativo sintonizado solo para ti. Unas preguntas rápidas — más o menos un minuto.')}</p>
      <div class="ob-act"><button class="obtn" data-ob="next">${L('Begin','Comenzar')}</button><button class="olink" data-ob="close">${L('Explore first','Explorar primero')}</button>
      <div class="seg" style="margin-top:14px"><button data-lang="en" class="${LANG==='en'?'on':''}">English</button><button data-lang="es" class="${LANG==='es'?'on':''}">Español</button></div></div></div>`;
  }else if(id==='name'){
    body=`<span class="ob-k">${L('Let’s begin','Empecemos')}</span><h2>${L('First, what should we','Primero, ¿cómo te')} <em>${L('call you?','llamamos?')}</em></h2>
      <input class="field" id="obName" autocomplete="given-name" placeholder="${L('Your name','Tu nombre')}" maxlength="40" value="${esc(ob.ans.name||'')}">`;
  }else if(q){
    const sel=ob.ans[q.id]||[], arty=q.options.some(o=>o.art);
    if(q.id==='vision'&&!ob.snd) ob.snd=Object.keys(UNHEARD)[Math.floor(Math.random()*6)];
    body=`<span class="ob-k">${qi+1} ${L('of','de')} ${QUESTIONS.length}</span><h2>${tx(q,'title')}</h2><p class="lead">${tx(q,'sub')}</p>
      ${q.id==='vision'?`<button class="snd" data-ob="snd"><i>${ICON.play}</i><div><b>${L('Play the sound','Reproduce el sonido')}</b><span>${L('Close your eyes · 4 seconds','Cierra los ojos · 4 segundos')}</span></div></button>`:''}
      <div class="tiles ${arty?'arty':''} ${q.preview?'listen':''}">${q.options.map(o=>`<button class="tile ${sel.includes(o.v)?'on':''}" data-opt="${o.v}" aria-pressed="${sel.includes(o.v)}">${o.art?art(o.art,o.seed):''}<i class="tk">${ICON.check}</i>${q.preview?'<i class="eq"><u></u><u></u><u></u><u></u></i>':''}<b>${tx(o,'label')}</b>${tx(o,'sub')?`<span>${tx(o,'sub')}</span>`:''}</button>`).join('')}</div>
      ${q.id==='vision'?`<label class="ob-k" for="obWord" style="display:block;margin-top:32px">${L('How would you describe this sound?','¿Cómo describirías este sonido?')}</label><input class="field sm" id="obWord" maxlength="60" autocomplete="off" placeholder="${L('A word, a texture, a memory…','Una palabra, una textura, un recuerdo…')}" value="${esc(ob.ans.soundWord||'')}">`:''}`;
  }else if(id==='key'){
    if(!ob.ans.user) ob.ans.user=suggestUser(ob.ans.name);
    const keep=profile&&profile.codeHash;
    body=`<span class="ob-k">${L('Your key','Tu llave')}</span><h2>${L('Your key to enter','Tu llave para entrar a')} <em>${L('your Oazis.','tu Oazis.')}</em></h2>
      <p class="lead">${L('A username, your email and a 4‑digit code. That’s all you need to come back in.','Un nombre de usuario, tu correo y un código de 4 números. Es todo lo que necesitas para volver a entrar.')}</p>
      <div class="keybox"><span class="ob-k">${L('Username','Nombre de usuario')}</span>
        <div class="handle"><b>@</b><input class="field" id="obUser" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" value="${esc(ob.ans.user)}"></div>
        <span class="ob-k">${L('Email','Correo')}</span>
        <input class="field sm mail" id="obEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="${L('you@email.com','tu@correo.com')}" value="${esc(ob.ans.email||'')}">
        <span class="ob-k" style="display:block;margin-top:30px">${L('4‑digit code','Código de 4 números')}${keep?L(' · leave empty to keep yours',' · déjalo vacío para mantener el tuyo'):''}</span>${pinHTML('obCode')}
        <p class="note">${L('Your Oazis lives on this device for now — at launch your email will keep it safe across devices. Remember your code.','Por ahora tu Oazis vive en este dispositivo — en el lanzamiento tu correo lo guardará en todos tus dispositivos. Recuerda tu código.')}</p></div>`;
  }else if(id==='build'){
    body=`<div class="ob-hero">${RIPPLE}<h2>${L('Tuning your','Sintonizando tu')} <em>Oazis…</em></h2>
      <ul class="build-list">${[L('Mapping your creative worlds','Mapeando tus mundos creativos'),L('Mixing your soundscape','Mezclando tu paisaje sonoro'),L('Shaping the sound to your taste','Dándole forma al sonido según tu gusto'),L('Choosing your first step','Eligiendo tu primer paso')].map(x=>`<li><i>${ICON.check}</i>${x}</li>`).join('')}</ul></div>`;
  }else if(id==='ready'){
    const pr=ob.ans, pl=PLACES[(pr.place||[])[0]]||PLACES.ocean, ws=topWorlds(pr), fs=firstStep(pr), g=pr.genres||[], vi=VISION[(pr.vision||[])[0]], ps=persona(pr);
    body=`<span class="ob-k">${L('Your Oazis is ready','Tu Oazis está listo')} · @${esc(pr.user)}</span><h2>${esc(pr.name)}, ${L('this space is','este espacio es')} <em>${L('yours.','tuyo.')}</em></h2>
      <div class="ready">${art(pl.art,pl.seed)}<div><dl class="sum">
        <dt>${L('Your station','Tu estación')}</dt><dd><b>${L(`${esc(pr.name)}’s Oazis`,`El Oazis de ${esc(pr.name)}`)}</b> — ${WORLDS[ws[0]].name} ${L('tuned to','sintonizado en')} ${tx(pl,'label').toLowerCase()}${g.length?L(', shaped by ',', con ')+g.map(x=>tx(optOf('genres',x),'label').toLowerCase()).join(', '):''}.</dd>
        <dt>${L('Your worlds','Tus mundos')}</dt><dd class="sumrow">${ws.slice(0,3).map(w=>`<span class="pill">${WORLDS[w].name}</span>`).join('')}</dd>
        <dt>${L('Your profile','Tu perfil')}</dt><dd><b>${ps.name}</b> — ${ps.why}</dd>
        ${vi?`<dt>${L('Your radio will look like','Tu radio se verá como')}</dt><dd><em class="serif" style="font-size:21px">${tx(vi,'label')}</em>${pr.soundWord?` · “${esc(pr.soundWord)}”`:''}</dd>`:''}
        <dt>${L('Your first step','Tu primer paso')}</dt><dd><b>${esc(fs.t.title)}</b> — ${esc(fs.why)}</dd>
      </dl></div></div>`;
  }
  if(!['welcome','build'].includes(id)){
    const hint=id==='ready'?'':id==='name'?L('Press Enter to continue','Presiona Enter para continuar'):id==='key'?L('Username, email and a 4‑digit code','Usuario, correo y código de 4 números'):q.preview?L('Tap to listen','Toca para escuchar'):q.type==='single'?L('Choose one','Elige una'):q.max?L(`Choose up to ${q.max}`,`Elige hasta ${q.max}`):L('Choose all that apply','Elige todas las que apliquen');
    foot=`<div class="ob-foot"><button class="olink" data-ob="back">${L('Back','Atrás')}</button><span class="hint">${hint}</span>
      <button class="obtn" id="obNext" data-ob="${id==='ready'?'finish':'next'}" ${obOK(id)?'':'disabled'}>${id==='ready'?L('Enter my Oazis','Entrar a mi Oazis'):L('Continue','Continuar')}</button></div>`;
  }
  $('#ob').innerHTML=`<div class="ob-bar"><span class="bs">${MARK}${WORD}</span><div class="ob-prog"><i style="width:${Math.min(1,ob.step/(steps.length-1))*100}%"></i></div>
    <button class="ob-x" data-ob="close">${profile?L('Close','Cerrar'):L('Not now','Ahora no')}</button></div>
    <div class="ob-in"><div class="ob-step">${body}</div></div>${foot}`;
  $('#ob').scrollTop=0;
  if(id==='name'){const n=$('#obName');setTimeout(()=>n.focus(),80);n.oninput=()=>{ob.ans.name=n.value;$('#obNext').disabled=!obOK('name');};n.onkeydown=e=>{if(e.key==='Enter'&&obOK('name'))obGo(1);};}
  if(id==='key'){
    const u=$('#obUser'), m=$('#obEmail'), upd=()=>{$('#obNext').disabled=!obOK('key');};
    m.oninput=()=>{ob.ans.email=m.value.trim().toLowerCase();upd();};
    u.oninput=()=>{u.value=u.value.toLowerCase().replace(/[^a-z0-9._]/g,'').slice(0,20);ob.ans.user=u.value;upd();};
    bindPin('obCode',v=>{ob.codeLen=v.length;ob.code=v.length===4?v:null;upd();if(v.length===4)$('#obNext').focus();});
  }
  if(id==='vision'){const w=$('#obWord');w.oninput=()=>{ob.ans.soundWord=w.value;$('#obNext').disabled=!obOK('vision');};}
  if(id==='build'){
    const lis=[...document.querySelectorAll('.build-list li')];
    lis.forEach((li,i)=>setTimeout(()=>li.classList.add('ok'),500+i*650));
    ob.t=setTimeout(()=>obGo(1),500+lis.length*650+500);
  }
}
function obGo(d){
  Preview.stop(); clearTimeout(ob.t);
  const steps=obSteps();
  ob.step=Math.max(0,Math.min(steps.length-1,ob.step+d));
  if(d<0&&steps[ob.step]==='build') ob.step--;
  renderOB();
}
async function finishOB(){
  const isNew=!profile, u=ob.ans.user;
  const codeHash=ob.code?await hashCode(u,ob.code):profile.codeHash;
  ob.code=null;
  profile={...ob.ans,name:ob.ans.name.trim(),user:u,codeHash,created:(profile&&profile.created)||Date.now(),updated:Date.now()};
  store.set('profile',profile); setIn(); myStation();
  tuner.station=topWorlds(profile)[0]; tuner.p=posOf(WORLDS[tuner.station].hz);
  closeOB(); location.hash='#/fm'; render(); renderLib();
  playTrack(TRACKS['my-oazis']);
  toast(isNew?L(`Welcome to your Oazis, ${profile.name}`,`Bienvenido a tu Oazis, ${profile.name}`):L('Your Oazis was updated','Tu Oazis se actualizó'));
}
$('#ob').addEventListener('click',e=>{
  if(ob.mode!=='funnel') return;
  const o=e.target.closest('[data-opt]'), b=e.target.closest('[data-ob]');
  if(o){
    const q=QG(obSteps()[ob.step]), v=o.dataset.opt; let sel=ob.ans[q.id]||[]; const was=sel.includes(v);
    if(q.type==='single') sel=[v];
    else if(was) sel=sel.filter(x=>x!==v);
    else{sel=v==='none'?[]:sel.filter(x=>x!=='none');sel.push(v);if(q.max&&sel.length>q.max)sel.shift();}
    ob.ans[q.id]=sel;
    document.querySelectorAll('#ob .tile').forEach(t=>{const on=sel.includes(t.dataset.opt);t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);});
    $('#obNext').disabled=!obOK(q.id);
    if(q.preview){if(was&&q.type!=='single')Preview.stop();else{Preview.play(q.preview,v);o.classList.add('playing');}}
    if(q.id==='lang'){LANG=v;store.set('lang',v);applyI18n();render();renderLib();updatePlayer();}
    if(q.type==='single'&&!q.preview&&!q.stay){clearTimeout(ob.t);ob.t=setTimeout(()=>obGo(1),380);}
    return;
  }
  if(b){const a=b.dataset.ob;if(a==='snd'){Preview.play('unheard',ob.snd);b.classList.add('playing');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('playing'),4200);return;}if(a==='next')obGo(1);if(a==='back')obGo(-1);if(a==='close')closeOB();if(a==='finish')finishOB();}
});

/* ---------- lock: enter your Oazis ---------- */
function openLock(){
  ob.mode='lock'; $('#ob').classList.add('open');
  $('#ob').innerHTML=`<div class="ob-bar"><span class="bs">${MARK}${WORD}</span><span></span><span></span></div>
    <div class="ob-in"><div class="ob-step ob-hero">${RIPPLE}<span class="ob-k">${L('Welcome back','Bienvenido de vuelta')} · @${esc(profile.user)}</span>
      <h2>${L('Enter your','Entra a tu')} <em>Oazis.</em></h2><p class="lead">${L('Your 4‑digit code','Tu código de 4 números')}</p>
      ${pinHTML('lockPin')}<p class="pin-msg" id="pinMsg"></p>
      <div class="ob-act"><button class="olink" id="obReset">${L('Not you? Create a new Oazis','¿No eres tú? Crea un nuevo Oazis')}</button></div></div></div>`;
  const pin=bindPin('lockPin',async v=>{
    if(v.length<4) return;
    if(await hashCode(profile.user,v)===profile.codeHash){setIn();closeOB();autoStart();toast(L(`Welcome back, ${profile.name}`,`Bienvenido de vuelta, ${profile.name}`));}
    else{const p=$('#lockPin').parentNode;p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');$('#pinMsg').textContent=L('That code doesn’t match. Try again.','Ese código no coincide. Intenta de nuevo.');setTimeout(()=>pin.clear(),380);}
  });
  setTimeout(()=>pin.inp.focus(),120);
  $('#obReset').onclick=()=>{
    if(!confirm(L('Start a new Oazis on this device? The current one will be replaced.','¿Crear un nuevo Oazis en este dispositivo? El actual será reemplazado.'))) return;
    profile=null; store.set('profile',null); delete TRACKS['my-oazis']; render(); renderLib(); openOB(0);
  };
}

/* ---------- boot ---------- */
setTheme(store.get('theme','light'));
if(profile){myStation();tuner.station=topWorlds(profile)[0];tuner.p=posOf(WORLDS[tuner.station].hz);}
applyI18n(); syncSliders(); renderLib(); render(); updatePlayer(); requestAnimationFrame(frame);
/* Oazis FM is ON when you arrive. Browsers keep audio silent until the first touch, so that touch wakes it. */
function autoStart(){if(!state.playing) playTrack(TRACKS['my-oazis']||TRACKS['station-'+tuner.station],{fromTuner:true});}
const wake=()=>{if(blocked()){tuner.unlocked=true;Engine.resume();setTimeout(()=>tuner.unlocked=false,500);}};
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,wake,{capture:true,passive:true}));
if(!profile) setTimeout(()=>openOB(0),700);
else if(profile.codeHash&&!isIn()) openLock();
else autoStart();
</script>
</body>
</html>
