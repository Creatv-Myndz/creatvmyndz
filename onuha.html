<body>
<title>MYND ONUHA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* MYND ONUHA — a blank black mind for ONUHA's projects: guide, steps to do, vision board, connections, dates → calendar.
   Pure black, white type, chrome logo. Archivo (wide for titles) + IBM Plex Mono for small labels. */
:root{
  --bg:#000; --ink:#fff; --muted:#8c8c8c; --faint:#565656;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.26);
  --card:rgba(255,255,255,.035); --card-2:rgba(255,255,255,.07);
  --chrome:linear-gradient(180deg,#fff 0%,#c9cfd6 45%,#7d8590 55%,#eef1f4 100%);
  --t-envio:#9fc4ff; --t-salida:#ffffff; --t-grabacion:#ffd36b; --t-contenido:#b7f0c8; --t-otro:#8c8c8c;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:none}
.gbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.gbg img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;filter:grayscale(1) blur(5px) brightness(.55);transform:scale(1.06)}
.gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 40%,rgba(0,0,0,.35),rgba(0,0,0,.78)),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55))}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1.5px solid #fff;outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.wide{font-stretch:125%;text-transform:uppercase;letter-spacing:.01em}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.nav{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;justify-self:start}
.nav button{border:0;background:none;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.nav button[aria-current="true"]{background:#fff;color:#000}
.logo{background:none;border:0;padding:2px 4px;display:grid;place-items:center}
.logo img{height:24px;width:auto;display:block}
.br{justify-self:end;display:flex;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:500;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.danger{color:#ff9b9b;border-color:rgba(255,120,120,.35)}
.btn.sm{padding:6px 10px;font-size:12.5px}
main{max-width:1200px;margin:0 auto;padding:28px 16px 110px}

/* home */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:clamp(40px,9vw,96px) 16px clamp(30px,6vw,60px);text-align:center;border-radius:22px;overflow:hidden;isolation:isolate}
.hero.has-bg{min-height:min(62vh,560px);justify-content:center;margin-top:18px;border:1px solid var(--line)}
.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(.15)}
.hero.has-bg::before{display:none;content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 70% at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.8)),linear-gradient(180deg,rgba(0,0,0,.2),#000)}
.hero.has-bg p{color:#d6d6d6}
.hero .hlogo{width:min(560px,82vw);height:auto;filter:drop-shadow(0 20px 60px rgba(255,255,255,.12))}
.hero .hedit{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.lang{font-family:var(--mono);font-size:11px;letter-spacing:.12em;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);padding:6px 10px}
.gate{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;padding:24px 16px}
.gate form{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.gate img{width:min(420px,80vw);height:auto}
.gate input{width:100%;text-align:center;border:1px solid var(--line-2);background:#0a0a0a;color:#fff;border-radius:14px;padding:14px 18px;font-family:var(--mono);font-size:16px;letter-spacing:.3em;text-transform:uppercase}
.gate input:focus{outline:none;border-color:#fff}
.gate .err{min-height:18px;margin:0;color:#ff9b8a;font-size:13px}
.gate .btn{width:100%;justify-content:center}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.sech{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:44px 0 14px}
.sech h2{font-size:22px;font-stretch:125%;text-transform:uppercase;letter-spacing:.02em}
.sech .count{font-family:var(--mono);font-size:11px;color:var(--faint)}
.grow{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;transition:border-color .2s,transform .2s}
.pc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.cov{display:grid;place-items:center;overflow:hidden;position:relative;background:#0d0d0d;border-radius:14px;color:#fff;text-align:center}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov b{position:relative;font-stretch:125%;text-transform:uppercase;font-size:12px;padding:8px;line-height:1.1}
.pc .cov{width:96px;height:96px;box-shadow:0 0 0 1px var(--line)}
.pi{display:flex;flex-direction:column;gap:3px;min-width:0}
.pi b{font-size:16.5px;font-stretch:115%;text-transform:uppercase;letter-spacing:.01em;line-height:1.15}
.pi .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pi .nx{font-size:13px;color:#cfcfcf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;gap:10px;margin-top:6px}
.track{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--chrome)}
.pr em{font-style:normal;font-family:var(--mono);font-size:11px;min-width:34px;text-align:right}
.add{border:1px dashed var(--line-2);border-radius:18px;background:none;color:var(--muted);min-height:126px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px}
.add b{font-size:24px;font-weight:300;color:#fff}
.add:hover{border-color:#fff;color:#fff}

/* project */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-bottom:22px}
.back:hover{color:#fff;border-color:var(--line-2)}
.ph{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:end;margin-bottom:10px}
.ph .cov{width:220px;height:220px;border-radius:20px;box-shadow:0 0 0 1px var(--line-2)}
.ph h1{font-size:clamp(34px,6vw,68px);line-height:.95;font-stretch:125%;text-transform:uppercase;letter-spacing:.005em}
.ph .tag{margin:12px 0 0;color:#cfcfcf;max-width:62ch;white-space:pre-line}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:none;text-decoration:none}
button.chip,a.chip{cursor:pointer}button.chip:hover,a.chip:hover{color:#fff;border-color:var(--line-2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.guide{white-space:pre-line;color:#e6e6e6;font-size:15.5px;line-height:1.7;max-width:80ch}
.guide.empty{color:var(--faint)}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);background:none;display:grid;place-items:center;padding:0;font-size:12px;color:#000}
.ck[aria-pressed="true"]{background:#fff;border-color:#fff}
.step input[type=text]{background:none;border:0;color:#fff;font:inherit;font-size:15px;padding:4px 0;width:100%}
.step input[type=text]:focus{outline:none;border-bottom:1px solid var(--line-2)}
.step.done input[type=text]{color:var(--faint);text-decoration:line-through}
.step input[type=date]{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:inherit;font-family:var(--mono);font-size:11px;padding:3px 6px;color-scheme:dark}
.x{border:0;background:none;color:var(--faint);font-size:16px;padding:2px 6px}
.x:hover{color:#ff9b9b}
.newrow{display:flex;gap:8px;margin-top:10px}
.newrow input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;padding:10px 12px}
.newrow input:focus{outline:none;border-color:#fff}
/* vision board · masonry collage */
.collage{columns:4 200px;column-gap:6px}
.collage figure{position:relative;margin:0 0 6px;break-inside:avoid}
.collage img{display:block;width:100%;height:auto;border-radius:12px;cursor:zoom-in;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s}
.collage img:hover{transform:scale(1.02);filter:brightness(1.1)}
.collage .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;opacity:0;transition:opacity .2s}
.collage figure:hover .x{opacity:1}
.upl{border:1px dashed var(--line-2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;color:var(--muted);cursor:pointer;break-inside:avoid;margin-bottom:6px}
.upl:hover{border-color:#fff;color:#fff}
/* connections */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;background:var(--card)}
.lk:hover{border-color:var(--line-2)}
.lk b{display:block;font-size:14.5px;font-weight:600}
.lk small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.linkform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-top:10px}
.linkform input,.evform input,.evform select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;padding:10px 12px;min-width:0;color-scheme:dark}
/* dates */
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:110px 92px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ev .d{font-family:var(--mono);font-size:12px}
.ty{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid currentColor;justify-self:start}
.ty.envio{color:var(--t-envio)}.ty.salida{color:var(--t-salida)}.ty.grabacion{color:var(--t-grabacion)}.ty.contenido{color:var(--t-contenido)}.ty.otro{color:var(--t-otro)}
.evform{display:grid;grid-template-columns:150px 150px 1fr auto;gap:8px;margin-top:10px}
/* calendar */
.cal{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.calh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.calh h3{font-size:18px;font-stretch:125%;text-transform:uppercase;flex:1}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.35}
.day .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day.today .n{color:#000;background:#fff;border-radius:999px;padding:0 6px;align-self:flex-start}
.ce{display:block;text-align:left;border:0;border-left:2px solid currentColor;background:rgba(255,255,255,.06);border-radius:4px;padding:2px 6px;font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.ce.envio{border-color:var(--t-envio)}.ce.salida{border-color:#fff}.ce.grabacion{border-color:var(--t-grabacion)}.ce.contenido{border-color:var(--t-contenido)}.ce.otro{border-color:var(--t-otro)}.ce.step{border-left-style:dotted;color:#cfcfcf}
.upc{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#070707;border-left:1px solid var(--line-2);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh h2{font-size:24px;font-stretch:125%;text-transform:uppercase}
.xb{border:1px solid var(--line-2);background:none;border-radius:50%;width:34px;height:34px;font-size:17px}
.dbody{padding:18px 20px 30px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.f > label,.f > .lab{display:block;margin-bottom:7px}
.f input[type=text],.f textarea,.f select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;padding:10px 12px}
.f textarea{min-height:200px;line-height:1.6;resize:vertical}
.f input:focus,.f textarea:focus{outline:none;border-color:#fff}
.covedit{display:flex;gap:10px;align-items:center}
.covedit .cov{width:110px;height:110px}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.saved{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:90}
.lb{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 16px}
.lb img{max-width:min(92vw,1100px);max-height:calc(100vh - 140px);object-fit:contain;border-radius:10px}
.lb .row{display:flex;gap:8px}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:30px 20px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .ph{grid-template-columns:minmax(0,1fr);gap:16px}.ph .cov{width:150px;height:150px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .pc{grid-template-columns:80px minmax(0,1fr)}.pc .cov{width:80px;height:80px}
  .linkform,.evform{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:minmax(0,1fr) auto;}.ev .ty{grid-column:1}
  .day{min-height:64px;padding:4px}.ce{font-size:0;padding:0;height:6px;border-left-width:0;background:currentColor}
  .ce.envio{color:var(--t-envio)}.ce.salida{color:#fff}.ce.grabacion{color:var(--t-grabacion)}.ce.contenido{color:var(--t-contenido)}.ce.otro{color:var(--t-otro)}.ce.step{color:#888}
  .collage{columns:2;column-gap:5px}
  .logo img{height:18px}
  .nav button{padding:5px 9px;font-size:12px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .25s cubic-bezier(.2,.7,.2,1) both}@keyframes sl{from{transform:translateX(30px)}to{transform:none}}}
.gate[hidden]{display:none}

/* ---------- project groups */
.grp{margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp .lab{color:#cfcfcf}

/* ---------- creative direction ("The Aura Shift") */
.dir{display:flex;flex-direction:column;gap:clamp(56px,9vw,110px);padding-bottom:80px}
.dcover{position:relative;min-height:calc(100vh - 80px);display:grid;align-items:end}
.dcover .dbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}

.dcin{padding:clamp(22px,5vw,56px);display:flex;flex-direction:column;gap:14px}
.dlogo{width:min(320px,60vw);height:auto}
.dcover h1{margin:0;font-stretch:125%;font-weight:800;font-size:clamp(40px,9vw,112px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.dcover p{margin:0;max-width:56ch;color:#d9d9d9;font-size:clamp(15px,1.6vw,18px)}
.dnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dnav a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#ddd;text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;background:rgba(0,0,0,.4)}
.dnav a:hover{background:#fff;color:#000}
.dsec{scroll-margin-top:80px}
.dk{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.dn{font-family:var(--mono);font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
.dt{margin:0 0 22px;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(26px,4.6vw,54px);line-height:.98;max-width:22ch}
.dp{margin:0 0 14px;max-width:62ch;color:#d4d4d4;font-size:16px;line-height:1.6}
.big{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(22px,3.4vw,40px);line-height:1.02;margin:22px 0 0;max-width:20ch}
.big.end{margin:40px auto 0;text-align:center;max-width:24ch}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(18px,4vw,48px);align-items:start}
.split.rev{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
.split figure{margin:0}.split img{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block;cursor:zoom-in}
.chat img{background:#111}
.tall img{max-height:640px;object-fit:cover}
.bq{margin:0 0 18px;font-size:clamp(18px,2.2vw,24px);line-height:1.35;font-weight:500;border-left:2px solid #fff;padding-left:16px}
.bq cite{display:block;margin-top:8px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.stats div{background:#000;padding:18px 16px;display:flex;flex-direction:column;gap:2px}
.stats b{font-stretch:125%;font-weight:800;font-size:clamp(24px,3.4vw,38px)}
.stats span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.cmts{columns:3 260px;column-gap:10px;margin-bottom:10px}
.cm{break-inside:avoid;margin:0 0 10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.cm q{font-size:15px;line-height:1.4;quotes:"“" "”"}
.cm small{color:var(--muted);font-size:12.5px}
.ck2{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cm.concern{border-color:rgba(255,155,138,.4)}.cm.concern .ck2{color:#ff9b8a}
.cm.confused .ck2{color:#ffd36b}.cm.old .ck2{color:#9fc4ff}.cm.faith .ck2{color:#e8d6ff}.cm.respect .ck2{color:#b7f0c8}
.callout{margin-top:22px;border:1px solid var(--line-2);border-radius:16px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.callout>b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.callout .dp{margin:0}
/* mind map */
.mm{margin:26px 0 8px;display:flex;flex-direction:column;align-items:center}
.mm-c{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(16px,2vw,22px);padding:12px 22px;border-radius:999px;background:#fff;color:#000;text-align:center;box-shadow:0 0 40px rgba(255,255,255,.18)}
.mm-bus{width:1px;height:22px;background:var(--line-2)}
.mm-br{width:100%;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;border-top:1px solid var(--line-2);padding-top:20px;position:relative}
.mm-b{position:relative;display:flex;flex-direction:column;gap:6px}
.mm-b::before{content:"";position:absolute;top:-20px;left:50%;width:1px;height:20px;background:var(--line-2)}
.mm-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:9px 10px;border:1px solid #fff;border-radius:12px}
.mm-i{font-size:13.5px;line-height:1.35;text-align:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:#d6d6d6;background:var(--card)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px}
.flow::before,.flow::after{display:none}
.fl{border:1px solid var(--line-2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.fl b{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(16px,2vw,22px);line-height:1.05}
.fl small{color:var(--muted)}
.fl.bridge{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02))}
.fl.to{background:#fff;color:#000}.fl.to small,.fl.to .lab{color:#444}
.flow .fl:nth-child(2){grid-column:3}.flow .fl:nth-child(3){grid-column:5}
.flow{grid-template-columns:1fr 1fr 1fr}.flow .fl:nth-child(n){grid-column:auto}
.rules,.next{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li,.next li{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card)}
.rules b,.next b{display:block;font-size:17px}
.rules small,.next small{color:var(--muted);font-size:14px}
.rn{font-family:var(--mono);font-size:12px;min-width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.next li[data-go]{cursor:pointer}.next li[data-go]:hover{border-color:#fff}
.next li div{flex:1}.go2{font-size:20px;color:var(--muted)}
.refs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ref{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.rl{height:96px;border-radius:12px;background:#0d0d0d;display:grid;place-items:center;padding:14px;margin-bottom:6px}
.rl.light{background:#f2f2f2}
.rl img{max-width:100%;max-height:64px;object-fit:contain}
.tmt{font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:.06em;color:#d4af37}
.ref b{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:15px}
.ref p{margin:0;color:#cfcfcf;font-size:13.5px;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line-2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.opt b{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:17px;line-height:1.1}
.opt p{margin:0;color:#cfcfcf;font-size:14px}
.mlogo{display:flex;align-items:center;gap:14px;margin-top:16px}
.mlogo img{height:16px;width:auto}.mlogo a{font-family:var(--mono);font-size:11px;color:var(--muted)}
.brandrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.brandrow img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line)}

/* ---------- skills HUD */
.hud{position:relative;margin-top:18px;border-radius:22px;overflow:hidden;border:1px solid rgba(140,220,255,.35);isolation:isolate;min-height:80vh;
  --cy:#7fe3ff;box-shadow:0 0 0 1px rgba(127,227,255,.08),0 0 80px rgba(127,227,255,.08) inset}
.hudbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;filter:grayscale(1) contrast(1.1) brightness(.55)}
.hud::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(80% 60% at 30% 40%,rgba(0,30,45,.25),rgba(0,0,0,.85)),linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.75))}
.scan{position:absolute;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(127,227,255,.05) 0 1px,transparent 1px 3px)}
.hud-in{padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.hud .lab{color:var(--cy)}
.hud-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.blink{animation:bl 1.6s steps(2) infinite}@keyframes bl{50%{opacity:.35}}
.hud-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(16px,3vw,36px)}
.char{position:relative;aspect-ratio:3/4;max-height:520px;border:1px solid rgba(127,227,255,.35);background:rgba(0,10,15,.45);display:grid;place-items:center;overflow:hidden}
.char img{width:100%;height:100%;object-fit:cover}
.char-empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px}
.char-empty span{font-stretch:125%;font-weight:800;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--cy);opacity:.8}
.char-empty small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.corner{position:absolute;width:18px;height:18px;border:2px solid var(--cy);z-index:2}
.corner.tl{top:6px;left:6px;border-right:0;border-bottom:0}.corner.tr{top:6px;right:6px;border-left:0;border-bottom:0}
.corner.bl{bottom:6px;left:6px;border-right:0;border-top:0}.corner.br2{bottom:6px;right:6px;border-left:0;border-top:0}
.charup{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3}
.stats2{display:flex;flex-direction:column;gap:14px;justify-content:center}
.pname h1{margin:4px 0;font-stretch:125%;font-weight:800;font-size:clamp(32px,5.4vw,64px);line-height:.92;text-shadow:0 0 30px rgba(127,227,255,.35)}
.cls{font-family:var(--mono);font-size:12px;color:#d8f6ff}
.quest,.aura{border:1px solid rgba(127,227,255,.3);background:rgba(0,12,18,.55);padding:14px 16px;display:grid;gap:4px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.quest b{font-size:17px;margin-bottom:6px}
.aura{grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
.aura b{grid-row:span 2;font-size:54px;line-height:1;color:var(--cy);text-shadow:0 0 24px var(--cy)}
.aura small{color:#d8f6ff}
.skh{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(127,227,255,.3);padding-bottom:8px}
.skh h2{margin:0;font-stretch:125%;font-weight:800;letter-spacing:.2em;font-size:clamp(22px,3vw,32px)}
.skills{display:grid;gap:14px}
.sk{border:1px solid rgba(127,227,255,.22);background:rgba(0,10,15,.55);padding:14px 16px;display:grid;gap:10px}
.skt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.skn{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.skv{font-stretch:125%;font-weight:800;font-size:clamp(20px,2.6vw,30px);color:var(--cy);text-shadow:0 0 18px rgba(127,227,255,.6)}
.segbar{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.segbar i{height:14px;background:rgba(127,227,255,.1);transform:skewX(-18deg)}
.segbar i.on{background:var(--cy);box-shadow:0 0 10px rgba(127,227,255,.7)}

.sk.locked{border-style:dashed;border-color:rgba(255,255,255,.25);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px),rgba(0,0,0,.6)}
.sk.locked .skv{color:#9a9a9a;text-shadow:none;font-size:16px;letter-spacing:.2em}
.sk.locked .segbar i.on{background:#666;box-shadow:none}
.lkm{font-family:var(--mono);font-size:11px;color:#9a9a9a}
.skedit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.skedit input[type=range]{flex:1;min-width:160px;accent-color:var(--cy)}
.skedit label{font-family:var(--mono);font-size:11px;display:flex;gap:6px;align-items:center}

@media (max-width:760px){
  .split,.split.rev,.hud-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mm-br{grid-template-columns:1fr;border-top:0;padding-top:0}
  .mm-b::before{display:none}
  .mm-b{border-left:1px solid var(--line-2);padding-left:12px;margin-left:8px}
  .mm-h,.mm-i{text-align:left}
  .flow,.opts{grid-template-columns:1fr}
  .refs{grid-template-columns:1fr 1fr}
  .brandrow{grid-template-columns:1fr 1fr}
  .bar-in{grid-template-columns:minmax(0,1fr) auto!important}
  .bar-in>.logo{display:none}
  .nav{overflow-x:auto;max-width:100%;min-width:0;scrollbar-width:none}
  .nav button{flex:none;padding:6px 10px}
  .br .btn.sm{padding:6px 9px}
  .nav::-webkit-scrollbar{display:none}
  .char{max-height:420px}
}

/* Direction: Samuel's back stays fixed behind everything; the content moves over it */
.dfix{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.dfix img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;filter:grayscale(1) contrast(1.05);transform:scale(1.04);animation:breathe 18s ease-in-out infinite alternate}
.dfix::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,rgba(0,0,0,.15),rgba(0,0,0,.7) 75%),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45))}
@keyframes breathe{to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.dfix img{animation:none}}
.dir{position:relative;z-index:1}
.dsec{background:rgba(0,0,0,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,44px)}
.dcover h1{text-shadow:0 10px 60px rgba(0,0,0,.6)}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.goals li{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:rgba(255,255,255,.04)}
.goals b{display:block;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(16px,2vw,22px);line-height:1.05}
.goals small{color:var(--muted);font-size:14px}
.goals li.hero-goal{background:#fff;color:#000;border-color:#fff;padding:24px}
.goals li.hero-goal b{font-size:clamp(24px,4vw,46px)}
.goals li.hero-goal small{color:#333;font-size:16px}
.goals li.hero-goal .rn{border-color:#000}
.mm.quote .mm-c{max-width:640px;border-radius:22px;font-size:clamp(18px,2.6vw,30px);line-height:1.05;padding:20px 28px}
.plan{display:grid;gap:4px;margin:0 0 22px}
.plan p{margin:0;font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(20px,3.2vw,38px);line-height:1.02;opacity:.35}
.plan p:last-child{opacity:1;text-shadow:0 0 40px rgba(255,255,255,.35)}
.plan p:nth-child(2){opacity:.6}
/* character turning */
.charcol{display:flex;flex-direction:column;gap:10px}
.char{isolation:isolate}
.ring{position:absolute;left:50%;bottom:6%;width:70%;height:12%;transform:translateX(-50%);border-radius:50%;border:1px solid rgba(127,227,255,.6);box-shadow:0 0 40px rgba(127,227,255,.35),inset 0 0 30px rgba(127,227,255,.25);z-index:0}
.char .cv{position:absolute;inset:4% 0 7%;width:100%;height:89%;object-fit:contain;opacity:0;transform:scale(.96) translateX(16px);filter:blur(6px) drop-shadow(0 0 24px rgba(127,227,255,.25));transition:opacity .7s ease,transform .7s ease,filter .7s ease;z-index:1}
.char .cv.on{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 24px rgba(127,227,255,.25))}
.charlab{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap}
.charsel{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.charsel button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(127,227,255,.3);background:rgba(0,10,15,.6);color:#d8f6ff;padding:7px 4px}
.charsel button[aria-pressed="true"]{background:var(--cy,#7fe3ff);color:#001018;border-color:var(--cy,#7fe3ff)}
.pc,.cal,.sb,.card,.box{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

// ---------- skills: a game HUD. Values and locks are editable (db settings/skills).
const SKILLS=[
  {id:"motivational",n:{en:"Motivational speaking",es:"Discurso motivacional"},v:90},
  {id:"public",n:{en:"Public speaking",es:"Hablar en público"},v:80},
  {id:"raw",n:{en:"Raw speaking",es:"Hablar en crudo (RAW)"},v:85},
  {id:"rap",n:{en:"Rap",es:"Rap"},v:5},
  {id:"teach",n:{en:"Preaching · Faith · Teaching",es:"Predicar · Fe · Enseñar"},v:40,locked:true},
];
let skillsDoc={},skillsExists=false,skillsEdit=false,charIdx=0,charHold=0;
function skillVal(s){const o=(skillsDoc.values||{})[s.id];return typeof o==="number"?o:s.v;}
function skillLocked(s){const o=(skillsDoc.locked||{})[s.id];return typeof o==="boolean"?o:!!s.locked;}
async function saveSkills(patch){
  if(!can())return;skillsDoc=merge(skillsDoc,patch);render();
  try{if(skillsExists)await db.doc("settings/skills").update(patch);else{await db.doc("settings/skills").set(skillsDoc);skillsExists=true;}}catch(e){toast(t("saveErr"));}
}
function showChar(i){
  charIdx=(i+CHAR.length)%CHAR.length;
  document.querySelectorAll(".cv").forEach((el,k)=>el.classList.toggle("on",k===charIdx));
  document.querySelectorAll("[data-char]").forEach((el,k)=>el.setAttribute("aria-pressed",String(k===charIdx)));
}
setInterval(()=>{if(current!=="skills"||!document.querySelector(".cv"))return;if(Date.now()<charHold)return;showChar(charIdx+1);},2600);
function renderSkills(){
  const ed=can();
  $("#main").innerHTML=`<div class="hud"><img class="hudbg" src="${img(A_IMG.back)}" alt=""><div class="scan" aria-hidden="true"></div>
   <div class="hud-in">
    <div class="hud-top"><span class="lab">${X({en:"Player profile",es:"Perfil del jugador"})} · MYND ONUHA</span><span class="lab blink">● ${X({en:"Online",es:"En línea"})}</span></div>
    <div class="hud-grid">
     <div class="charcol"><div class="char"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br2"></span>
       <div class="ring" aria-hidden="true"></div>
       ${CHAR.map((c,k)=>`<img class="cv ${k===charIdx?"on":""}" src="${img(c.id)}" alt="${esc("Samuel Onuha · "+X(c.n))}">`).join("")}
       <span class="lab charlab">THE CHARACTER</span></div>
       <div class="charsel" role="group" aria-label="${X({en:"Views",es:"Vistas"})}">${CHAR.map((c,k)=>`<button data-char="${k}" aria-pressed="${k===charIdx}">${X(c.n)}</button>`).join("")}</div></div>
     <div class="stats2">
       <div class="pname"><span class="lab">${X({en:"Player",es:"Jugador"})}</span><h1>SAMUEL ONUHA</h1><span class="cls">${X({en:"Class: Artist · Builder",es:"Clase: Artista · Constructor"})}</span></div>
       <div class="quest"><span class="lab">${X({en:"Main quest",es:"Misión principal"})}</span><b>${X({en:"From e-commerce coach to artist & builder",es:"De coach del e-commerce a artista y constructor"})}</b>
         <span class="lab">${X({en:"Next unlock",es:"Próximo desbloqueo"})}</span><b>JOKER</b></div>
       <div class="aura"><span class="lab">AURA</span><b>∞</b><small>${X({en:"Always there. It was part of the plan.",es:"Siempre estuvo. Era parte del plan."})}</small></div>
     </div></div>
    <div class="skh"><h2>SKILLS</h2>${ed?`<button class="btn sm" data-skedit>${skillsEdit?X({en:"Done",es:"Listo"}):X({en:"Edit",es:"Editar"})}</button>`:""}</div>
    <div class="skills">${SKILLS.map(s=>{const v=skillVal(s),lk=skillLocked(s),seg=20,on=Math.round(v/100*seg);
      return `<div class="sk ${lk?"locked":""}"><div class="skt"><span class="skn">${lk?"🔒 ":""}${X(s.n)}</span><span class="skv">${lk?X({en:"LOCKED",es:"BLOQUEADO"}):v+"%"}</span></div>
       <div class="segbar" role="meter" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(X(s.n))}">${Array.from({length:seg},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("")}</div>
       ${lk?`<small class="lkm">${X({en:"Not for now. It stays locked on purpose.",es:"Por ahora no. Queda bloqueado a propósito."})} · ${v}%</small>`:""}
       ${skillsEdit&&ed?`<div class="skedit"><input type="range" min="0" max="100" value="${v}" data-skv="${s.id}" aria-label="${esc(X(s.n))}"><label><input type="checkbox" data-skl="${s.id}" ${lk?"checked":""}> ${X({en:"Locked",es:"Bloqueado"})}</label></div>`:""}</div>`;}).join("")}</div>
   </div></div>`;
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-skedit]")){skillsEdit=!skillsEdit;render();return;}
  const c=e.target.closest("[data-char]");if(c){charHold=Date.now()+8000;showChar(+c.dataset.char);}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("[data-skv]"))saveSkills({values:{[el.dataset.skv]:+el.value}});
  if(el.matches("[data-skl]"))saveSkills({locked:{[el.dataset.skl]:el.checked}});
});

const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function merge(a,b){const o=isObj(a)?{...a}:{};if(!isObj(b))return o;for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?merge(o[k],b[k]):(isObj(b[k])?merge({},b[k]):b[k]);}return o;}
function pathObj(p,v){const ks=p.split(".");const o={};let c=o;ks.forEach((k,i)=>{if(i===ks.length-1)c[k]=v;else c=c[k]={};});return o;}

let db=null,assets=null,canWrite=true,loaded=false,dl=null,settings={},settingsExists=false;

const order=()=>Object.keys(local).filter(s=>!local[s].deleted).sort((a,b)=>(local[a].order??99)-(local[b].order??99)||a.localeCompare(b));
function queue(slug,path,value,now){
  if(!canWrite||!db){toast(t("readOnly"));return;}
  local[slug]=merge(local[slug],pathObj(path,value));pending[slug]=merge(pending[slug]||{},pathObj(path,value));
  setSaved(t("saving"));clearTimeout(timers[slug]);timers[slug]=setTimeout(()=>flush(slug),now?0:600);
  if(now)render();
}
function flush(slug){
  chains[slug]=(chains[slug]||Promise.resolve()).then(async()=>{
    const patch=pending[slug];if(!patch)return;delete pending[slug];patch.updatedAt=Date.now();
    const ref=db.doc("projects/"+slug);
    if(raw[slug])await ref.update(patch);else{const full=merge(template(local[slug].name),local[slug]);full.updatedAt=Date.now();await ref.set(full);raw[slug]=full;}
    setSaved(t("saved"));
  }).catch(e=>{if(e&&e.code==="invalid_argument"){canWrite=false;toast(t("noEdit"));}else toast(t("saveErr"));setSaved("");});
}
async function saveSettings(patch){
  if(!can())return;settings=merge(settings,patch);render();
  try{if(settingsExists)await db.doc("settings/app").update(patch);else{await db.doc("settings/app").set(settings);settingsExists=true;}}catch(e){toast(t("saveErr"));}
}

// ---------- calendar: every project's dates + dated steps
function allEvents(){
  const out=[];
  order().forEach(s=>{const b=local[s];
    live(b.events).forEach(e=>e.date&&out.push({s,date:e.date,title:e.title||"",type:e.type||"otro",proj:b.name}));
    live(b.steps).forEach(e=>e.date&&!e.done&&out.push({s,date:e.date,title:e.text||"",type:"step",proj:b.name}));});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function calendarHTML(){
  const ev=allEvents(),m=calMonth,first=new Date(m.getFullYear(),m.getMonth(),1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const today=iso(new Date());let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d),es=ev.filter(e=>e.date===k);
    if(i>=35&&d.getMonth()!==m.getMonth())break;
    cells+=`<div class="day ${d.getMonth()!==m.getMonth()?"out":""} ${k===today?"today":""}"><span class="n">${d.getDate()}</span>${es.map(e=>`<button class="ce ${e.type}" data-go="${esc(e.s)}" title="${esc(e.proj)} · ${esc(e.title)}">${esc(e.title)}</button>`).join("")}</div>`;}
  const up=ev.filter(e=>e.date>=today&&e.type!=="step").slice(0,8);
  return `<section id="calendario"><div class="sech"><h2>${t("calendar")}</h2><span class="hint">${t("calHint")}</span></div>
   <div class="cal"><div class="calh"><h3>${t("months")[m.getMonth()]} ${m.getFullYear()}</h3><button class="btn sm" data-cal="-1" aria-label="${t("prev")}">‹</button><button class="btn sm" data-cal="0">${t("today")}</button><button class="btn sm" data-cal="1" aria-label="${t("next")}">›</button></div>
    <div class="grid7">${t("dow").map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="legend">${TYPES.map(k=>`<span><i style="background:var(--t-${k})"></i>${typeName(k)}</span>`).join("")}<span><i style="background:#888"></i>${t("datedStep")}</span></div></div>
   <div class="upc">${up.length?`<span class="lab">${t("upcoming")}</span>`+up.map(e=>`<button class="ev" data-go="${esc(e.s)}" style="text-align:left;background:none;color:#fff"><span class="d">${fmtD(e.date)}</span><span class="ty ${e.type}">${esc(typeName(e.type))}</span><span>${esc(e.title)} <span class="hint">· ${esc(e.proj)}</span></span><span></span></button>`).join(""):`<p class="hint">${t("noDates")}</p>`}</div></section>`;
}
function renderCal(){$("#main").innerHTML=calendarHTML();}

// ---------- interactions
document.addEventListener("click",e=>{
  if(e.target.closest("#drawerRoot")||e.target.closest("#gate"))return;
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const el=document.querySelector(j.getAttribute("href"));el&&el.scrollIntoView({behavior:"smooth"});return;}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return;}
  if(e.target.closest("[data-lang]")){lang=lang==="en"?"es":"en";store.set("onuha-lang",lang);render();return;}
  if(e.target.closest("[data-new]")){drawer={t:"new"};renderDrawer();return;}
  if(e.target.closest("[data-bgrm]")){saveSettings({heroBg:""});return;}
  const c=e.target.closest("[data-cal]");if(c){const v=+c.dataset.cal;calMonth=v===0?new Date(new Date().getFullYear(),new Date().getMonth(),1):new Date(calMonth.getFullYear(),calMonth.getMonth()+v,1);render();return;}
  const ck=e.target.closest("[data-ck]");if(ck){const st=local[current].steps[ck.dataset.ck];queue(current,`steps.${ck.dataset.ck}.done`,!st.done,true);return;}
  const d=e.target.closest("[data-del]");if(d){const p=d.dataset.del;queue(current,p.startsWith("vision.")?p:p+".deleted",p.startsWith("vision.")?"":true,true);return;}
  const z=e.target.closest("[data-zoom]");if(z){openLb(img(z.dataset.zoom));return;}
  const o=e.target.closest("[data-open]");if(o){drawer={t:o.dataset.open};renderDrawer();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.matches("#main [data-path]")){queue(current,el.dataset.path,el.value,el.type==="date");}
  if(el.matches("[data-visup]")&&el.files.length)addVision([...el.files]);
  if(el.matches("[data-coverup]")&&el.files[0])upCover(el.files[0]);
  if(el.matches("[data-bgup]")&&el.files[0])upBg(el.files[0]);
});
document.addEventListener("submit",e=>{
  const f=e.target;
  if(f.matches("[data-addstep]")){e.preventDefault();const i=f.querySelector("input"),v=i.value.trim();if(!v)return;const n=Math.max(0,...live(local[current].steps).map(x=>x.n||0))+1;queue(current,"steps."+newId("s"),{text:v,done:false,date:"",n,created:Date.now()},true);setTimeout(()=>{const ni=document.querySelector("[data-addstep] input");ni&&ni.focus();},30);return;}
  if(f.matches("[data-addlink]")){e.preventDefault();const url=f.url.value.trim();if(!url)return;queue(current,"links."+newId("l"),{label:f.label.value.trim(),url,note:"",created:Date.now()},true);return;}
  if(f.matches("[data-addev]")){e.preventDefault();queue(current,"events."+newId("e"),{date:f.date.value,type:f.type.value,title:f.title.value.trim(),created:Date.now()},true);return;}
  if(f.id==="newform"){e.preventDefault();const n=$("#newname").value.trim();if(!n)return;let s=slugify(n);while(local[s])s+="-2";
    local[s]=merge(template(n),{kind:$("#newkind").value,order:Math.max(0,...Object.values(local).map(b=>b.order||0))+1});drawer=null;queue(s,"name",n,true);go(s);return;}
});
document.addEventListener("paste",e=>{
  if(["home","cal","direction","skills"].includes(current)||!assets||!can())return;
  const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(x=>/^image\//.test(x.type));
  if(fs.length&&!(drawer&&drawer.t==="project")){e.preventDefault();addVision(fs);}
  else if(fs.length&&drawer&&drawer.t==="project"){e.preventDefault();upCover(fs[0]);}
});
async function addVision(files){for(const f of files.filter(x=>/^image\//.test(x.type))){try{const r=await assets.upload(f);queue(current,"vision."+newId("v"),r.id,true);}catch(err){toast(t("upErr"));}}}
async function upCover(f){try{const r=await assets.upload(f);queue(current,"cover",r.id,true);renderDrawer();}catch(err){toast(t("upErr"));}}
async function upBg(f){try{const r=await assets.upload(f);saveSettings({heroBg:r.id});}catch(err){toast(t("upErr"));}}

// ---------- drawer: new project, edit project, edit guide
function renderDrawer(){
  const r=$("#drawerRoot");if(!drawer){r.innerHTML="";return;}
  const shell=(title,body,foot)=>`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="${esc(title)}"><div class="dh"><div><span class="lab">MYND ONUHA</span><h2>${esc(title)}</h2></div><button class="xb" data-close aria-label="${t("close")}">×</button></div><div class="dbody">${body}</div>${foot?`<div class="dfoot">${foot}</div>`:""}</aside>`;
  const kindOpts=sel=>KINDS.map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(kindName(k))}</option>`).join("");
  if(drawer.t==="new"){r.innerHTML=shell(t("newProject"),`<form id="newform" style="display:flex;flex-direction:column;gap:14px"><div class="f"><label class="lab" for="newname">${t("name")}</label><input type="text" id="newname" required placeholder="I'M THE STORM"></div>
    <div class="f"><label class="lab" for="newkind">${t("type")}</label><select id="newkind">${kindOpts("Project")}</select></div><button class="btn primary" type="submit">${t("create")}</button></form>`);setTimeout(()=>{const i=$("#newname");i&&i.focus();},30);return;}
  const b=local[current];if(!b){r.innerHTML="";return;}
  if(drawer.t==="guide"){r.innerHTML=shell(t("guide"),`<div class="f"><label class="lab" for="g">${t("guideLbl")}</label><textarea id="g" data-dpath="guide" style="min-height:360px">${esc(b.guide)}</textarea></div>`,`<span class="saved" id="saved"></span><button class="btn primary" data-close>${t("done")}</button>`);return;}
  const kinds=KINDS.includes(b.kind)?kindOpts(b.kind):kindOpts(b.kind)+`<option selected>${esc(b.kind)}</option>`;
  r.innerHTML=shell(t("editProject"),`<div class="f"><label class="lab" for="pn">${t("name")}</label><input type="text" id="pn" data-dpath="name" value="${esc(b.name)}"></div>
    <div class="f"><label class="lab" for="pk">${t("type")}</label><select id="pk" data-dpath="kind">${kinds}</select></div>
    <div class="f"><label class="lab" for="pg">${lang==="es"?"Grupo":"Group"}</label><select id="pg" data-dpath="group">${GROUPS.map(([g,n])=>`<option value="${g}" ${(b.group||"other")===g?"selected":""}>${esc(n[lang])}</option>`).join("")}</select></div>
    <div class="f"><label class="lab" for="pt">${t("tagline")}</label><textarea id="pt" data-dpath="tagline" style="min-height:90px">${esc(b.tagline)}</textarea></div>
    <div class="f"><span class="lab">${t("cover")}</span><div class="covedit">${cov(b)}${assets&&can()?`<label class="btn">${t("upCover")}<input type="file" accept="image/*" data-coverup hidden></label>`:""}</div><p class="hint">${t("pasteCover")}</p></div>
    <div class="f"><button class="btn danger" data-delproj>${t("delProject")}</button></div>`,`<span class="saved" id="saved"></span><button class="btn primary" data-close>${t("done")}</button>`);
}
document.addEventListener("input",e=>{const el=e.target.closest(".drawer [data-dpath]");if(el)queue(current,el.dataset.dpath,el.value);});
document.addEventListener("change",e=>{const el=e.target.closest(".drawer select[data-dpath]");if(el)queue(current,el.dataset.dpath,el.value,true);});
document.addEventListener("click",e=>{
  if(!e.target.closest("#drawerRoot"))return;
  if(e.target.closest("[data-close]")){drawer=null;render();return;}
  if(e.target.closest("[data-delproj]")){queue(current,"deleted",true);drawer=null;toast(t("deleted"));go("home");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#lb"))$("#lb").remove();else if(drawer){drawer=null;render();}}});

// ---------- lightbox
function openLb(src){const r=document.createElement("div");r.className="lb";r.id="lb";r.innerHTML=`<img src="${esc(src)}" alt=""><div class="row">${dl?`<button class="btn primary" data-lbdl>${t("download")}</button>`:""}<button class="btn" data-lbx>${t("close")}</button></div>`;document.body.appendChild(r);
  r.addEventListener("click",async ev=>{if(ev.target.closest("[data-lbx]")||ev.target===r)r.remove();if(ev.target.closest("[data-lbdl]")){try{const res=await fetch(src);const bl=await res.blob();await dl.save({filename:"onuha-"+Date.now()+"."+((bl.type.split("/")[1]||"jpg").replace("jpeg","jpg")),data:bl});toast(t("downloaded"));}catch(err){if(!err||err.code!=="declined")toast(t("dlErr"));}}});}

// ---------- access code
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function showGate(){
  const g=$("#gate");g.hidden=false;
  g.innerHTML=`<form id="gateform" autocomplete="off"><img src="${LOGO}" alt="ONUHA"><span class="lab">MYND ONUHA</span>
    <label class="lab" for="code" style="margin-top:10px">${t("code")}</label><input id="code" type="password" autocapitalize="characters" spellcheck="false" placeholder="••••••" required>
    <p class="err" id="gerr" aria-live="polite"></p><button class="btn primary" type="submit">${t("enter")}</button>
    <button class="lang" type="button" data-glang>${lang==="en"?"ES":"EN"}</button></form>`;
  setTimeout(()=>{const i=$("#code");i&&i.focus();},30);
}
async function unlock(){
  const v=(($("#code")||{}).value||"").replace(/\s+/g,"").toUpperCase();
  let ok=false;try{ok=(await sha(v))===HASH;}catch(_){ok=v==="UCHENA";}
  if(ok){store.set("onuha-ok",HASH);$("#gate").hidden=true;$("#gate").innerHTML="";render();}
  else{const er=$("#gerr");if(er)er.textContent=t("wrong");}
}
// The board runs in a sandboxed frame where form submit may never fire: handle the button and Enter directly.
document.addEventListener("submit",e=>{if(e.target.id==="gateform"){e.preventDefault();unlock();}});
document.addEventListener("click",e=>{const b=e.target.closest("#gateform button[type=submit]");if(b){e.preventDefault();unlock();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="code"){e.preventDefault();unlock();}});
document.addEventListener("click",e=>{if(e.target.closest("[data-glang]")){lang=lang==="en"?"es":"en";store.set("onuha-lang",lang);showGate();render();}});

// ---------- boot
const h=(location.hash||"").slice(1);if(h)current=h;
window.addEventListener("hashchange",()=>{const x=(location.hash||"").slice(1)||"home";if(x!==current&&!x.endsWith("-sec")){current=x;drawer=null;render();window.scrollTo({top:0});}});
render();
(async()=>{
  if(ST){canWrite=false;settings=ST.settings||{};skillsDoc=ST.skills||{};Object.entries(ST.projects).forEach(([k,v])=>{if(!v.deleted)local[k]=merge(template(v.name),v);});loaded=true;render();return;}
  if(!window.claude||!window.claude.use){loaded=true;render();return;}
  const [d,a,u,w]=await Promise.all([claude.use("db"),claude.use("assets"),claude.use("user"),claude.use("downloads")]);
  db=d;assets=a;dl=w;
  if(u){try{const c=await u.can("data.write");if(c===false)canWrite=false;}catch(_){}}
  if(!db){canWrite=false;loaded=true;render();return;}
  db.doc("settings/skills").onSnapshot(sn=>{skillsExists=!!(sn&&sn.exists);skillsDoc=(sn&&sn.exists&&sn.data())||{};if(busy())return;if(current==="skills")render();},()=>{});
  db.doc("settings/app").onSnapshot(sn=>{settingsExists=!!(sn&&sn.exists);settings=(sn&&sn.exists&&sn.data())||{};if(busy())return;render();},()=>{});
  db.collection("projects").onSnapshot(snap=>{
    snap.docs.forEach(doc=>{const data=doc.data();raw[doc.id]=data;if(data.deleted){delete local[doc.id];return;}local[doc.id]=merge(merge(template(data.name),data),pending[doc.id]||{});});
    snap.docChanges().forEach(c=>{if(c.type==="removed"){delete raw[c.doc.id];delete local[c.doc.id];}});
    loaded=true;if(busy())return;render();
  },()=>toast(t("lost")));
})();

})();
</script>

</body>
</html>
